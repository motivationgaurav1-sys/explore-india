<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>

  </head>
  <body>

   
    <h1>University Resistration Form</h1>
    <p>Please fill out the form below to resister.</p>
    <hr>
    <form>
      <h2>Personal Details</h2>
      <label for="fname">First Name:</label>
      <input type="text" name="userfirstname" id="fname" placeholder="e.g: Arjun" required>
      <br><br>


      <label for="lname">Last Name:</label>
      <input type="text" name="userlastname" id="lname" placeholder="e.g: Pundir">
      <br><br>
      <label for="dob">Date of Birth:</label>
      <input type="date" name="userdob" id="dob" required>
      <br><br>

      <h2>Gender:</h2>
      <!-- move inputs before the labels. -->
       <input type="radio" name="gender" id="male" value="male">
      <label for="male">Male</label>
      
      <br>    
      <input type="radio" name="gender" id="female" value="female">
      <label for="female">Female</label>
      <br>
      <input type="radio" name="gender" id="other" value="other">
      <label for="other">Other</label>
      
      <br><br>
      <h2>Upload your Photo:</h2>    
      <input type="file" name="file">
      <hr>
      <br>
      <h2>Contact Information:</h2>
      <label for="email">Email Address:</label>
      <input type="email" name="email" placeholder="you@24gmail.com" id="email">
      <br><br>
      <label for="phone">Phone Number:</label>
      <input type="tel" name="contact" placeholder="e.g: 9732047675" id="phone">
      <br><br>
      <label for="address">Mailing Address:</label>
      <br>
      <textarea name="address" id="address" rows="10" cols="10"></textarea>
      <hr>
      <h2>Academic Information:</h2>
      <label for="course">Select Your Course:</label>
      <br>

      <select name="course" id="course">
        <option value="CSE">CSE</option>
        <option value="ML">ML</option>
        <option value="AI">AI</option>
        <option value="FULL STACK">FULL STACK</option>
        <option value="DATA SCIEMCE">DATA SCIENCE</option>

      </select>
      <br><br>
      <label >Extra curricular Interests:</label>

      <br>

      <input type="checkbox" id="sport" name="extra interest" value="sports">
      <label for="sport">Sports</label>
      <br>
      <input type="checkbox" id="music" name="extra interest" value="music and arts">
      <label for="music">Music & Arts</label>
      <br>
      <input type="checkbox" id="clubs" name="extra interest" value="technology clubs">
      <label for="clubs">Technology Clubs</label>
      <br>
      <input type="checkbox" id="volu" name="extra interest" value="volutter">
      <label for="volu">Voluteering</label>
      <br>
      <hr>
      <h2>Create Your Account:</h2>
      <label for="pass">Create a Password:</label>
      <input type="password" name="password" id="pass">
      <br><br>
      <label for="sec-q">Security Questions:</label>
    
      <select name="security question" id="sec-q">
        <option value="what is your pet name">What is your pet name?</option>
        <option value="your name">your name</option>
        <option value="abc">ABC</option>
        <option value="efd">EFG</option>
      </select>
      <br><br>
      <label for="security">Security Question:</label>
      <input type="text" name="security questions" id="security">
      <br><br>
      <input type="checkbox" name="term&cond" id="term" value="agree">
      <label for="term">I agree to the Terms and Conditions.</label>
      <hr>
      <button type="submit">Resister</button>
      <button type="reset">Clear Form </button>









    </form>
      
   
  </body>
</html>
